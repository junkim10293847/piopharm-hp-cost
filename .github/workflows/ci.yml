name: 테스트
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: 가상 기초 파일로 명령줄 도구 실행
        run: |
          npm run sample
          node cli/hp-cost.js sample/가상_기초파일.xlsx -o sample/결과.xlsx
