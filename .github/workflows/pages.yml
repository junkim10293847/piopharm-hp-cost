name: 웹앱 배포 (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: 웹앱 파일만 모으기
        run: |
          mkdir -p _site/src
          cp index.html _site/
          cp src/*.js _site/src/
          # 캐시 때문에 예전 계산 파일이 섞이지 않게, 배포마다 스크립트 주소에 커밋 번호를 붙임
          sed -i -E "s#(src/[a-z]+\.js)\"#\1?v=${GITHUB_SHA::7}\"#g" _site/index.html
          grep -o 'src/[a-z]*\.js?v=[0-9a-f]*' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
